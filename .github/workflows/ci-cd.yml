name: CI/CD Pipeline - Recetas DevOps

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # IE2: Pruebas automatizadas y Compilación (Java 17)
  build-and-test:
    name: Compilación y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Ejecutar Pruebas Unitarias
        run: mvn clean test

      # IE3: Análisis de Seguridad con Snyk (si no hay Token, continua sin bloquear la compilación básica)
      - name: Escaneo de Seguridad (Snyk)
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # IE4 e IE5: Construcción de Contenedor y Despliegue Simulado
  docker-build-deploy:
    name: Construcción de Imagen y Despliegue Simulado
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Construir Imagen Docker (IE1)
        run: docker build -t recetas-devops:latest .

      - name: Levantar servicio con Docker Compose (IE5)
        run: |
          docker-compose up -d
          docker-compose ps