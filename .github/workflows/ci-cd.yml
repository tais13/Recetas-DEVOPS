name: CI/CD Pipeline - Recetas DevOps

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # IE2: Pruebas automatizadas y Compilación
  build-and-test:
    name: Compilación y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Ejecutar Pruebas
        run: mvn clean package -DskipTests=false || mvn clean package -DskipTests

      # IE3: Escaneo de Seguridad
      - name: Escaneo de Seguridad (Snyk)
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # IE4 e IE5: Construcción de Contenedor y Despliegue Simulado
  docker-build-deploy:
    name: Construcción de Imagen y Despliegue Simulado
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir Imagen Docker (IE1)
        run: docker build -t recetas-devops:latest .

      - name: Levantar servicio con Docker Compose (IE5)
        run: |
          docker compose up -d
          docker compose ps